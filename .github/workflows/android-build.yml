name: Android Build

# Builds the UNSIGNED release universal APK (arm64, 32-bit ARM, x86_64) for a
# release (android-release FR-34, schema 6.1), the way windows-build.yml builds
# the Windows installer. No App Bundle: neither consumer (the GitHub release and
# F-Droid) takes one. This job holds no signing key or password: with no keystore
# properties file present, the committed Gradle project builds unsigned, and the
# release Mac signs the artifact (the snowraven-release skill's Android section).
# F-Droid builds its own APK from the same tag with the same commands
# (pipeline/android-release/fdroid/com.dtgibson.snowraven.yml), so the build
# lines here are the recipe's lines: the frontend build, then
# scripts/android/build-apk.sh. The pins come from scripts/android/toolchain.env.
#
# Trigger: push a version tag (vX.Y.Z), or run manually.
#
# Every action is pinned to a full commit SHA with its release in a trailing
# comment (security L3): the APK this job builds is signed with the user's key
# and published, so a moved tag or a compromised action could change it in a
# way no device check would see. To move a pin, resolve the new release's tag
# with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (peel an annotated tag
# through git/tags/<sha> to the commit) and update the SHA and the comment
# together; androidProjectPins.test.ts refuses a `uses:` with a mutable ref.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Keep the release build read-only even if the repository default changes.
permissions:
  contents: read

jobs:
  android:
    name: Build Android universal APK (unsigned)
    # Pinned image, for the same reason windows-build.yml pins its own.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Read the toolchain pins
        run: |
          set -a
          . scripts/android/toolchain.env
          set +a
          for v in RUST_TOOLCHAIN RUST_TARGETS TAURI_CLI_VERSION GRADLE_VERSION NDK_VERSION JAVA_VERSION NODE_MAJOR SDK_PLATFORM BUILD_TOOLS; do
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          echo "RUST_TARGETS_CSV=$(echo "$RUST_TARGETS" | tr ' ' ',')" >> "$GITHUB_ENV"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_MAJOR }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install the pinned Android SDK packages
        run: |
          # The runner image ships the Android command-line tools at $ANDROID_HOME.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found under \$ANDROID_HOME ($ANDROID_HOME)"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-$SDK_PLATFORM" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1 (2026-10-01); the toolchain comes from the input below, never from the ref
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.RUST_TARGETS_CSV }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli from crates.io (cached)
        uses: taiki-e/cache-cargo-install-action@7447f04c51f2ba27ca35e7f1e28fab848c5b3ba7 # v2.3.1
        with:
          tool: tauri-cli@${{ env.TAURI_CLI_VERSION }}

      - name: Put the pinned Gradle on PATH
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build the frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Build Android app (unsigned release universal APK)
        run: |
          # No SNOWRAVEN_ANDROID_KEYSTORE_PROPERTIES and no keystore.properties
          # exist here, so app/build.gradle.kts creates no signing config.
          test -z "${SNOWRAVEN_ANDROID_KEYSTORE_PROPERTIES:-}"
          test ! -e src-tauri/gen/android/keystore.properties
          sh scripts/android/build-apk.sh

      - name: Collect the APK
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          # Exactly one, or stop: the Windows job's artifact-selection lesson.
          mapfile -t APKS < <(find "$OUT" -name '*.apk')
          echo "APKs: ${APKS[*]:-none}"
          [ "${#APKS[@]}" -eq 1 ] || { echo "expected exactly one universal .apk"; exit 1; }
          mkdir -p dist-android
          cp "${APKS[0]}" "dist-android/SnowRaven_${VERSION}_android_universal_unsigned.apk"
          ls -la dist-android

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build
          path: dist-android/*
          if-no-files-found: error
