name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel a superseded in-flight run of the SAME ref (a quick re-push to main, or
# new commits on a PR) — main and PRs get distinct groups so they never cancel
# each other. (pages.yml deliberately keeps cancel-in-progress:false for publishes.)
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

# The floor, stated here rather than inherited. The org default is currently
# `read` (measured, not assumed), so this grants nothing new today -- but the
# frontend job now installs a third-party dependency tree and downloads and
# executes two browser engines, and the bound on that should be visible to
# whoever reads this file rather than living in a setting outside the repo that
# could be flipped to "read and write" with no diff here. Nothing in any job
# writes: checkout reads, npm, pip and cargo install from public registries with
# no token, the Rust cache uses Actions' own cache service, and the gate only
# runs code. If a future step needs more, add it to
# that step rather than widening this.
permissions:
  contents: read

# Every action is pinned to a full commit SHA with its release in a trailing
# comment, as android-build.yml's are (security L3): a moved tag or a
# compromised action would otherwise run someone else's code here. Each pin is
# the commit its previous tag resolved to when it was pinned, so pinning changed
# no step. To move one, resolve the new release's tag with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (peel an annotated tag
# through git/tags/<sha> to the commit) and update the SHA and the comment
# together; frontend/src/lib/workflowActionPins.test.ts refuses a `uses:` with a
# mutable ref in any workflow.

jobs:
  frontend:
    name: Frontend — lint, test, build
    runs-on: ubuntu-latest
    # A hung harness would otherwise sit on GitHub's 6-hour default, reporting
    # neither green nor red. The runner bounds each harness itself, so this is
    # the outer bound on the whole job, never the working one.
    #
    # The arithmetic, recounted when `verify-hotspot-reports.mjs` took a
    # 1,800 s budget (hotspot-report-order-and-stats decisions.md D-12). The
    # gate's worst case is every harness at its own bound in `run.mjs`: six at
    # the 180 s default (1,080 s), `verify-plan-readout.mjs` and
    # `verify-plan-daylabels.mjs` at 600 s each (1,200 s),
    # `verify-hotspot-reports.mjs` at 1,800 s, and `verify-family-tree.mjs` at
    # 4,200 s (added at 1.0.76 at 1,200 s; raised to 2,400 s when it grew to
    # eight legs, measured 570 s on the dev Mac with both faces,
    # family-rollups-and-tree D-74; raised again at ten legs, measured 989 s,
    # D-80): 8,280 s, 138 min. The measured
    # rest of this job is 944 s, about 16 min: 888 s from setup to the end of
    # the vitest step on 2026-11-11 (the run at 2253d047), plus 56 s for the
    # build, the tooling install and the browser download on the last green run
    # (1.0.67), the newest that reached them. 138 + 16 is 154 min; 160 keeps
    # headroom over that sum (it was 108 + 16 = 124 against 130 at eight legs,
    # 88 + 16 = 104 against 110 before the Family Tree harness grew, and
    # 68 + 16 = 84 against 90 before it joined the gate). A healthy run is now
    # about 35 to 45 min (1.0.67's
    # gate took 485 s before the Hotspot Reports harness existed, and that
    # harness measured 570 to 590 s on the dev Mac under heavy load), which is
    # why the previous 40 could no longer hold even a green job. Recompute this
    # when a harness is added or a budget changes, rather than trusting the
    # number. Recounted when the build moved ahead of the suite
    # (security-bloat-deps-and-tests-cleanup): the same steps in a new order,
    # so the 944 s stands; the suite now also runs the 20
    # bundle rows and skips the local-only timing rows, and the first runs on
    # the branch give the new step times.
    timeout-minutes: 160
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The repository's one Node pin, which release.sh also enforces on the
          # Mac (security-bloat-deps-and-tests-cleanup D-03; it was '20' here).
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The production build comes BEFORE the suite, because rows in
      # entryChunk.test.ts, targetsSortSelectCss.test.ts and mapFabCascade.test.ts
      # read frontend/dist. Run after the build they test what ships; run before
      # it they skipped on every run while the step read as green. On CI a
      # missing build now fails those files (frontend/src/test/builtDist.ts).
      - run: npm run build
      # The suite contains deliberate same-run performance comparisons and
      # jsdom scheduling probes. On GitHub's shared runners, parallel Vitest
      # workers repeatedly starved unrelated files into timeouts and late-effect
      # assertions even though every failed file passed when rerun. Serialize
      # files so worker contention cannot become the thing this gate measures.
      #
      # SR_SKIP_LOCAL_ONLY_TIMING skips the speed-ratio rows that cannot read
      # steadily on these runners (frontend/src/test/localOnlyTiming.ts says
      # which bar they missed; each file says which of its rows still run
      # here). Every local full suite runs them.
      - run: npm run test -- --maxWorkers=1
        env:
          SR_SKIP_LOCAL_ONLY_TIMING: '1'

      # The real-engine verification gate. Playwright is declared in
      # website/tools, never in frontend: duplicating it there would drift the
      # version and put a browser download in every frontend install.
      #
      # `playwright@1.62.1` has NO install script (verified: no `scripts` in its
      # package.json, no `hasInstallScript` in the lockfile), so `npm ci` here
      # installs the packages and downloads nothing. The browsers are the next
      # step, and only the two the harnesses drive -- `--with-deps` because
      # WebKit needs system libraries on the runner.
      #
      # `CI` is always set on a GitHub runner, so `verify` FAILS rather than
      # skipping if Playwright cannot be resolved here. That is the point of it:
      # a gate that skips silently reports "not run" as "verified".
      - name: Install the verification tooling
        working-directory: website/tools
        run: npm ci
      # Playwright installs its own pinned Chromium build. The hosted runner's
      # separate Google Chrome apt source is unrelated, but `--with-deps` runs
      # apt-get update and a transient mismatch in that source otherwise blocks
      # every browser dependency from installing.
      - name: Isolate Playwright from the runner Chrome repository
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Install Chromium and WebKit
        working-directory: website/tools
        run: npx playwright install --with-deps chromium webkit
      # The app bundles no font: its stack is 'Inter', system-ui, 'Segoe UI',
      # Roboto, sans-serif (globals.css), so every harness that measures text
      # measures this machine's resolution of it. With nothing installed the
      # runner falls back to a DejaVu-metric face, wider than the face any
      # shipped platform resolves (SF on Apple, Segoe UI on Windows, Roboto on
      # Android, each measured passing), and verify-hotspot-reports.mjs's
      # tile-label row went red here on that alone (security-bloat-deps-and-
      # tests-cleanup, phase 2). Installing the stack's first family makes the
      # gate measure a face the app names; Inter passes as the others do. The
      # Hotspot Reports harness prints the face it measured.
      - name: Install the face the app's font stack names first
        run: sudo apt-get install -y --no-install-recommends fonts-inter
      - name: Real-engine verification gate
        working-directory: website/tools
        run: npm run verify -- ../../frontend/dist

  backend:
    name: Backend — lint, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Keep CI on the exact tool versions used by local release verification.
      # Unpinned Ruff 0.16.1 enabled 49 new repo-wide rules mid-release.
      - run: pip install ruff==0.15.20 pytest==9.1.1
      - run: ruff check .
      - run: pytest

  native:
    name: Native — cargo test (macOS)
    # Every Rust test under src-tauri, on a Mac, because a Linux job would run
    # only 76 of the 140: icloud.rs, whose 64 rows hold the regular-file, size
    # and symlink guards on container reads, is cfg(macos or ios) and compiles
    # nowhere else (security-bloat-deps-and-tests-cleanup D-07). Reversal: if
    # this job does not read steady across that run's three consecutive green
    # runs, it comes back out and the user is told.
    runs-on: macos-latest
    # Measured on the dev Mac: a cold `cargo test --locked -j 3` (a macOS
    # runner's core count) compiled 353 crates and ran the 140 rows in 80 s
    # wall, 201 s CPU. 30 minutes covers that build several times over on a
    # slower runner, plus the crate download, the toolchain install and the
    # cache upload, and still ends a hung job long before the frontend job's 160.
    # The first runs on the pull request give the runner's own times.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The Rust the release Mac builds with and the Android build pins (1.96.1),
      # read from the one file that pins it, so a red here means our code and
      # not a new compiler. The action keeps windows-build.yml's SHA pin; its
      # `toolchain` input picks the version (that workflow still takes stable).
      - name: Read the pinned Rust version
        working-directory: .
        run: |
          . scripts/android/toolchain.env
          echo "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15), the branch head; the toolchain comes from the input below, never from the ref
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      # No frontend build and no placeholder: a debug build with `devUrl` set
      # embeds no assets, so `generate_context!` never reads `frontendDist`
      # (tauri-codegen 2.6.2, context.rs). Measured on the dev Mac with
      # frontend/dist absent and the crate rebuilt: 140 of 140.
      - run: cargo test --locked
