name: Windows Build

# Builds the Windows installer + updater archive for a release.
# Option A: this job does NOT have the real signing key. It produces the
# updater archive using a throwaway key (discarded), and release.sh re-signs
# the archive locally with the real key. The artifacts are uploaded for
# release.sh to fetch via `gh run download`.
#
# Trigger: push a version tag (vX.Y.Z), or run manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Build Windows installer + updater
    # Pin the runner image explicitly. GitHub is redirecting BOTH the
    # `windows-latest` alias AND the explicit `windows-2025` label to
    # `windows-2025-vs2026` (VS2026) by 2026-06-15, so pinning to `windows-2025`
    # would NOT freeze the toolchain — that label gets repointed too. Instead we
    # move to the target image now and have verified the Rust/Tauri build is
    # green on it, so the June-15 redirect is a no-op for us. Revisit when
    # GitHub announces the next image migration.
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build Windows app
        run: |
          # On Windows the Tauri updater target is the NSIS installer itself
          # (*-setup.exe), not a separate archive. CI must not hold the real key,
          # so build with an ephemeral throwaway key (its .sig is discarded);
          # release.sh re-signs the installer locally with the real key.
          npx @tauri-apps/cli signer generate -w "$RUNNER_TEMP/sr-ci.key" -p ""
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/sr-ci.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npm run desktop:build

      - name: Collect installer
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-windows/
          ls -la dist-windows

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist-windows/*
          if-no-files-found: error
