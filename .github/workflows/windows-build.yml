name: Windows Build

# Builds the Windows installer + updater archive for a release.
# Option A: this job does NOT have the real signing key. It produces the
# updater archive using a throwaway key (discarded), and release.sh re-signs
# the archive locally with the real key. The artifacts are uploaded for
# release.sh to fetch via `gh run download`.
#
# Trigger: push a version tag (vX.Y.Z), or run manually.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Keep the release build read-only even if the repository default changes.
# Checkout is the only step that reads through GITHUB_TOKEN; caches and build
# artifacts use GitHub Actions' separate runtime services.
permissions:
  contents: read

# Every action is pinned to a full commit SHA with its release in a trailing
# comment (security L3), because this job builds the Windows installer that
# release.sh re-signs and publishes, so a moved tag or a compromised action could
# change it in a way no check would see. The convention, and how to move a pin,
# are in pipeline.yml's header; each pin is the commit its previous ref resolved
# to, so pinning changed no step. dtolnay/rust-toolchain was on its `stable`
# branch, whose action.yml defaults the `toolchain` input to stable, so the pin
# still installs whatever stable Rust is current when the job runs (the pin
# freezes the action's code, not the toolchain). frontend/src/lib/
# workflowActionPins.test.ts refuses a mutable ref.

jobs:
  windows:
    name: Build Windows installer + updater
    # Pin the runner image explicitly. GitHub is redirecting BOTH the
    # `windows-latest` alias AND the explicit `windows-2025` label to
    # `windows-2025-vs2026` (VS2026) by 2026-06-15, so pinning to `windows-2025`
    # would NOT freeze the toolchain — that label gets repointed too. Instead we
    # move to the target image now and have verified the Rust/Tauri build is
    # green on it, so the June-15 redirect is a no-op for us. Revisit when
    # GitHub announces the next image migration.
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable (2026-11-15), the branch head; its action.yml defaults toolchain to stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build Windows app
        run: |
          # On Windows the Tauri updater target is the NSIS installer itself
          # (*-setup.exe), not a separate archive. CI must not hold the real key,
          # so build with an ephemeral throwaway key (its .sig is discarded);
          # release.sh re-signs the installer locally with the real key.
          npx @tauri-apps/cli signer generate -w "$RUNNER_TEMP/sr-ci.key" -p ""
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/sr-ci.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npm run desktop:build

      - name: Collect installer
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist-windows/
          ls -la dist-windows

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-build
          path: dist-windows/*
          if-no-files-found: error
