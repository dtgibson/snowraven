/* ============================================================================
   NEW IN THIS CHANGE. Three additions, all built from registers above.
   (1) The two columns trade places, so the life list is last in the DOM and
       last in reading order: the rail of compact sections on the left, the
       list on the right. Same tracks, same pair of thresholds.
   (2) The opening figures card, "At a glance": two definition lists, tiles
       over facts. Counts are tiles in the header band's own figure
       register (micro-caps label over a figure) one step down, each with its
       denominator in the note register. Dated and linked facts are the
       shipped fact rows, moved up from Visits and media.
   (3) Offered, drawn only when switched on in the review bar: two short
       ranked lists in the ranked-row register.
   ========================================================================== */
.sr-hsr-report--next .sr-hsr-body { grid-template-columns: minmax(0, 24rem) minmax(0, 1fr); }
@container sr-hsr-report (max-width: 53.25em) {
  .sr-hsr-report--next .sr-hsr-body { grid-template-columns: minmax(0, 1fr); }
}
.sr-hsr-glance { display: flex; flex-direction: column; gap: 14px; }
/* Tiles: as many 8rem tracks as fit, and a short set stretches across the row
   (auto-fit), so three figures fill a wide card instead of huddling at its
   edge. A wrapped last row keeps the tracks of the rows above it. */
.sr-hsr-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(8rem, 100%), 1fr)); gap: 14px 16px; margin: 0; min-width: 0; }
/* Facts under the tiles: one column, or two where each can hold a 19rem row.
   The 34% term caps it at two, so the pairs read across (first and latest
   visit, time and biggest checklist, first and newest species). DOM order is
   row order. Each row's rule is on its top edge, so the first row's rule is
   the divider under the tiles and the last row leaves none behind. */
.sr-hsr-glance > .sr-hsr-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(max(19rem, 34%), 100%), 1fr)); column-gap: 36px; margin-bottom: -9px; }
.sr-hsr-glance > .sr-hsr-facts > .sr-hsr-fact { border-bottom: 0; border-top: 1px solid var(--sr-border-subtle); padding: 9px 0; }
/* No tiles (a place with one undated or untimed visit): the facts stand alone,
   one column, with no rule above the first. */
.sr-hsr-glance > .sr-hsr-facts:first-child { grid-template-columns: minmax(0, 1fr); }
.sr-hsr-glance > .sr-hsr-facts:first-child > .sr-hsr-fact:first-child { border-top: 0; padding-top: 0; }
.sr-hsr-tile { display: flex; flex-direction: column; min-width: 0; }
.sr-hsr-tile dt { overflow-wrap: break-word; }
.sr-hsr-tile-value { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; color: var(--sr-text); font-variant-numeric: tabular-nums; margin: 0 0 3px; }
.sr-hsr-tile-unit { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0; margin-left: 4px; }
/* A bird and its date on one fact row: the pair wraps as two items, and the
   name wraps inside its own cell (the shared BirdName rules stay as they are). */
.sr-hsr-fact-sp { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 10px; }
.sr-hsr-fact-sp .sr-birdname { max-width: 100%; }

    const h = stage.querySelector('#' + jump.dataset.jump);
    scrollToEl(h.closest('section'));
    h.focus({ preventScroll: true });
    return;
  }
  if (e.target.closest('[data-mock]')) { e.preventDefault(); return; }
  if (e.target.closest('[data-act="all"]')) { state.showAll = true; render(true); }
});
window.addEventListener('resize', () => requestAnimationFrame(measure));
render(false);
</script>
</body>
</html>
