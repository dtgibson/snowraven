<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SnowRaven launch splash — design preview</title>
  <style>
    :root {
      --sr-text-scale: 1;
      --sr-splash-field: #2D8653;
      --sr-splash-ink: #ffffff;
      --sr-splash-deep: #1a5c38;
      --sr-review-shadow: rgba(15, 37, 23, .24);
      --sr-review-border: rgba(26, 92, 56, .18);
      --sr-review-hover: #edf8f1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 320px; min-height: 100%; }
    html { background: var(--sr-splash-field); }
    body { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .stage {
      position: fixed;
      inset: 0;
      background: var(--sr-splash-field);
      color: var(--sr-splash-ink);
      overflow: hidden;
    }
    .mark {
      position: absolute;
      width: 88px;
      height: 88px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: var(--sr-splash-ink);
    }
    .mark svg { display: block; width: 100%; height: 100%; }
    .copy {
      position: absolute;
      top: calc(50% + 56px);
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      overflow-y: auto;
      text-align: center;
      scrollbar-width: thin;
    }
    .status {
      max-width: 20rem;
      margin: 0;
      color: var(--sr-splash-ink);
      font-size: calc(16px * var(--sr-text-scale));
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: .005em;
    }
    .stage[data-state="first"] .status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .reload {
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid var(--sr-splash-ink);
      border-radius: 8px;
      background: var(--sr-splash-ink);
      color: var(--sr-splash-deep);
      font: inherit;
      font-size: calc(16px * var(--sr-text-scale));
      font-weight: 600;
      line-height: 1.25;
      cursor: pointer;
      transition: background-color 120ms ease-out, color 120ms ease-out;
    }
    .reload:hover { background: var(--sr-splash-field); color: var(--sr-splash-ink); }
    .reload:focus-visible { outline: 3px solid var(--sr-splash-ink); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .review {
      position: fixed;
      z-index: 2;
      right: max(16px, env(safe-area-inset-right));
      top: max(16px, env(safe-area-inset-top));
      width: min(296px, calc(100vw - 32px));
      color: var(--sr-splash-deep);
      font-size: 13px;
    }
    .review summary {
      display: block;
      width: max-content;
      margin-left: auto;
      padding: 9px 13px;
      border: 1px solid var(--sr-review-border);
      border-radius: 8px;
      background: var(--sr-splash-ink);
      box-shadow: 0 5px 20px var(--sr-review-shadow);
      font-weight: 600;
      cursor: pointer;
      list-style: none;
    }
    .review summary::-webkit-details-marker { display: none; }
    .review summary:hover { background: var(--sr-review-hover); }
    .review summary:focus-visible, .review button:focus-visible { outline: 3px solid var(--sr-splash-deep); outline-offset: 2px; }
    .review[open] summary { border-radius: 8px 8px 0 0; }
    .review-panel {
      padding: 13px;
      border: 1px solid var(--sr-review-border);
      border-radius: 8px 0 8px 8px;
      background: var(--sr-splash-ink);
      box-shadow: 0 12px 30px var(--sr-review-shadow);
    }
    .review-panel p { margin: 0 0 10px; line-height: 1.45; }
    .review-panel .note { font-size: 11px; opacity: .8; }
    .states { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .states button {
      min-height: 38px;
      padding: 7px 8px;
      border: 1px solid var(--sr-review-border);
      border-radius: 6px;
      background: var(--sr-splash-ink);
      color: var(--sr-splash-deep);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .states button:hover { background: var(--sr-review-hover); }
    .states button[aria-pressed="true"] { background: var(--sr-splash-deep); color: var(--sr-splash-ink); }
    .text-scale {
      width: 100%;
      min-height: 38px;
      margin-top: 9px;
      padding: 7px 8px;
      border: 1px solid var(--sr-review-border);
      border-radius: 6px;
      background: var(--sr-splash-ink);
      color: var(--sr-splash-deep);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .text-scale:hover { background: var(--sr-review-hover); }
    .text-scale[aria-pressed="true"] { background: var(--sr-splash-deep); color: var(--sr-splash-ink); }
    @media (prefers-reduced-motion: reduce) {
      .reload { transition: none; }
    }
    @media (max-height: 460px) {
      .copy { top: calc(50% + 56px); }
    }
  </style>
</head>
<body>
  <main class="stage" data-state="first" id="stage" aria-label="SnowRaven opening preview">
    <div class="mark" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" focusable="false">

      </svg>
    </div>
    <div class="copy">
      <p class="status" role="status" id="status">Opening SnowRaven…</p>
      <button class="reload" id="reload" type="button" hidden>Reload</button>
    </div>
  </main>
  <details class="review" id="review">
    <summary>Review splash states</summary>
    <div class="review-panel">
      <p>Inspect the opening and its slow-start states.</p>
      <p class="note">These controls are for design review only. SnowRaven shows no controls on its first frame.</p>
      <div class="states" role="group" aria-label="Splash state">
        <button type="button" data-show="first" aria-pressed="true">First frame</button>
        <button type="button" data-show="slow" aria-pressed="false">After 2s</button>
        <button type="button" data-show="long" aria-pressed="false">After 15s</button>
        <button type="button" data-show="error" aria-pressed="false">Known failure</button>
      </div>
      <button class="text-scale" type="button" id="text-scale" aria-pressed="false">200% text size</button>
    </div>
  </details>
  <script>
    const stage = document.getElementById('stage');
    const status = document.getElementById('status');
    const reload = document.getElementById('reload');
    const stateButtons = [...document.querySelectorAll('[data-show]')];
    const textScale = document.getElementById('text-scale');
    const review = document.getElementById('review');
    const messages = {
      first: 'Opening SnowRaven…',
      slow: 'Opening SnowRaven…',
      long: 'SnowRaven is taking longer than expected',
      error: 'SnowRaven couldn’t open'
    };
    function showState(next) {
      stage.dataset.state = next;
      status.textContent = messages[next];
      reload.hidden = next !== 'long' && next !== 'error';
      stateButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.show === next)));
      review.open = false;
    }
    stateButtons.forEach(button => button.addEventListener('click', () => showState(button.dataset.show)));
    textScale.addEventListener('click', () => {
      const enlarged = textScale.getAttribute('aria-pressed') !== 'true';
      textScale.setAttribute('aria-pressed', String(enlarged));
      document.documentElement.style.setProperty('--sr-text-scale', enlarged ? '2' : '1');
    });
    reload.addEventListener('click', () => window.location.reload());
  </script>
</body>
</html>
