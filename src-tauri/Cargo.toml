[package]
name = "snowraven"
version = "0.0.0"
description = "SnowRaven — Birding Analytics Desktop App"
authors = []
license = ""
repository = "https://github.com/dtgibson/snowraven"
default-run = "snowraven"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snowraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snowraven"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
# Cross-platform: native clipboard write for desktop auto-copy (weather lookup).
# The plugin supports iOS, so the copy-after-await path works there too (FR-17).
tauri-plugin-clipboard-manager = "2"
# Cross-platform: backs the sync platform() probe behind isIOS() (schema §2.5).
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
# Cross-platform: used by the get_timezone command (weather feature) on every OS,
# iOS included. Must stay in [dependencies], not a target-scoped block (CLAUDE.md).
tzf-rs = "0.4"

# Desktop-only: the in-app updater and process restart/exit. NOT compiled into
# mobile binaries — FR-14's "no self-update capability" holds at the binary
# level (also the App Review posture). Registration is #[cfg(desktop)] in lib.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Mobile-only (schema §2.7/§2.6): geolocation for "Use my location" (the desktop
# native get_location paths are byte-untouched), and dialog for the Mechanism B
# document-picker fallback (see frontend/src/lib/iosImport.ts).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"
tauri-plugin-dialog = "2"

# Apple-only (macOS + iOS): the objc2 bindings shared by the macOS location
# command and the iCloud Sync native layer (src/icloud.rs), plus the SHA-256
# digest the shared-record format carries. sha2 is apple-only BY USE (only
# icloud.rs computes a digest), so it belongs here rather than in
# [dependencies]; the cross-platform rule (CLAUDE.md) cuts the other way for
# crates a Windows/Linux command needs. objc2-foundation's default feature set
# already enables every framework module listed; the list is spelled out so the
# surface icloud.rs depends on is visible here rather than implied by defaults.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "NSFileManager", "NSFileCoordinator", "NSMetadata", "NSMetadataAttributes",
  "NSNotification", "NSHost", "NSURL", "NSString", "NSArray", "NSDictionary",
  "NSError", "NSData", "NSOperation", "NSPredicate", "NSValue", "block2",
] }
block2 = "0.6"
sha2 = "0.10"

# macOS-only: CoreLocation for the native get_location command and the oneshot
# channel it completes through. Genuinely macOS-only crates stay here.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-location = "0.3"
tokio = { version = "1", features = ["sync"] }

# iOS-only: UIDevice for the sync device label and platform (iphone/ipad).
# A separate iOS block rather than the android|ios mobile block above, because
# objc2-ui-kit is an Apple-vendor crate and has no meaning on Android.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", features = ["UIDevice"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Devices_Geolocation",
  "Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
