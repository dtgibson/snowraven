[package]
name = "snowraven"
version = "0.0.0"
description = "SnowRaven — Birding Analytics Desktop App"
authors = []
license = ""
repository = "https://github.com/dtgibson/snowraven"
default-run = "snowraven"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snowraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snowraven"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-geolocation = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
# Cross-platform: used by the get_timezone command (weather feature) on every desktop OS.
tzf-rs = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Devices_Geolocation",
  "Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
