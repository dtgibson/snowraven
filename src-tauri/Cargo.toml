[package]
name = "snowraven"
version = "0.0.0"
description = "SnowRaven — Birding Analytics Desktop App"
authors = []
license = ""
repository = "https://github.com/dtgibson/snowraven"
default-run = "snowraven"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snowraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snowraven"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
# Cross-platform: native clipboard write for desktop auto-copy (weather lookup).
# The plugin supports iOS, so the copy-after-await path works there too (FR-17).
tauri-plugin-clipboard-manager = "2"
# Cross-platform: backs the sync platform() probe behind isIOS() (schema §2.5).
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
# Cross-platform: used by the get_timezone command (weather feature) on every OS,
# iOS included. Must stay in [dependencies], not a target-scoped block (CLAUDE.md).
tzf-rs = "0.4"

# Desktop-only: the in-app updater and process restart/exit. NOT compiled into
# mobile binaries — FR-14's "no self-update capability" holds at the binary
# level (also the App Review posture). Registration is #[cfg(desktop)] in lib.rs.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Mobile-only (schema §2.7/§2.6): geolocation for "Use my location" (the desktop
# native get_location paths are byte-untouched), and dialog for the Mechanism B
# document-picker fallback (see frontend/src/lib/iosImport.ts).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-geolocation = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-location = "0.3"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Devices_Geolocation",
  "Foundation",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
