[package]
name = "snowraven"
version = "0.0.0"
description = "SnowRaven — Birding Analytics Desktop App"
authors = []
license = ""
repository = "https://github.com/dtgibson/snowraven"
default-run = "snowraven"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "snowraven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "snowraven"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
